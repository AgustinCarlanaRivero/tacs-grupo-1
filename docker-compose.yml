services:
  # --- Backend API (Express) ---
  backend:
    build: ./backend
    container_name: tacs-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000

  # --- Frontend (Next.js) ---
  frontend:
    build: ./frontend
    container_name: tacs-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend
