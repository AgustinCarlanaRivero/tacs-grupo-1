services:
  # --- Backend API (Express) ---
  backend:
    build: ./backend
    container_name: tacs-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.prod
  # --- Frontend (Next.js) ---
  frontend:
    build: ./frontend
    container_name: tacs-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.prod
    depends_on:
      - backend
